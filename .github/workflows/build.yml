name: Decompile APK Asli

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download JADX & Decompile APK
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx-1.5.1.zip -d jadx_bin
          chmod +x jadx_bin/bin/jadx

          APK_FILE=$(find . -maxdepth 2 -name "*.apk" | head -n 1)
          echo "File APK ditemukan: $APK_FILE"
          ./jadx_bin/bin/jadx -d hasil_decompile "$APK_FILE" || true

      - name: Tampilkan Hanya Kode Pengirim Webhook
        run: |
          echo "=== DAFTAR FILE DI com/ger/notificationwebhookapp ==="
          ls -la hasil_decompile/sources/com/ger/notificationwebhookapp/

          echo "=== ISI FILE SERVICE / PENGIRIM HTTP ==="
          grep -rn -C 40 -E "http|HttpURLConnection|OkHttp|JSONObject|kunciEntri|X-API-Token|updateStatus" hasil_decompile/sources/com/ger/notificationwebhookapp/ || true


      - name: Upload Source Code Hasil Decompile
        uses: actions/upload-artifact@v4
        with:
          name: Source-Code-APK-Asli
          path: hasil_decompile/
