name: Decompile APK Asli

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download JADX & Decompile APK
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx-1.5.1.zip -d jadx_bin
          chmod +x jadx_bin/bin/jadx

          APK_FILE=$(find . -maxdepth 2 -name "*.apk" | head -n 1)
          echo "File APK ditemukan: $APK_FILE"
          ./jadx_bin/bin/jadx -d hasil_decompile "$APK_FILE" || true

      - name: Tampilkan Isi NotificationListener Mulai Baris 60
        run: |
          echo "=== LANJUTAN NotificationListener.java (BARIS 60 - SELESAI) ==="
          tail -n +60 hasil_decompile/sources/com/ger/notificationwebhookapp/NotificationListener.java

          echo "=== ISI WebhookProfile.java ==="
          cat hasil_decompile/sources/com/ger/notificationwebhookapp/WebhookProfile.java
